plugins { id 'com.android.application' }
android {
 namespace 'com.jimmy.bluepointer'
 compileSdk 35
 buildToolsVersion "35.0.0"
 defaultConfig { applicationId 'com.jimmy.bluepointer'; minSdk 28; targetSdk 35; versionCode 8; versionName '1.7' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['assets'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies { implementation "com.google.mlkit:digital-ink-recognition:19.0.0" }
